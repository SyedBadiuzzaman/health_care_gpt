[project]
name = "my-rag-platform"
version = "0.2.0"
description = "Patient-scoped medical history RAG workspace"
requires-python = ">=3.12"
dependencies = [
    "doc-agent-api",
    "doc-agent-dev-auth",
    "doc-agent-worker",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["black", "mypy", "ruff"]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/dev-auth",
    "apps/worker",
    "packages/common",
    "packages/core-rag",
    "packages/db",
]

[tool.uv.sources]
doc-agent-api = { workspace = true }
doc-agent-common = { workspace = true }
doc-agent-core = { workspace = true }
doc-agent-db = { workspace = true }
doc-agent-dev-auth = { workspace = true }
doc-agent-worker = { workspace = true }

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["nemoguardrails", "nemoguardrails.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.black]
target-version = ["py312"]
