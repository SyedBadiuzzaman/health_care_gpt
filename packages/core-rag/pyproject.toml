[project]
name = "doc-agent-core"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "doc-agent-common",
    "google-genai>=2,<3",
    "langchain-google-genai>=3,<5",
    "nemoguardrails>=0.22,<1",
    "numpy>=2,<3",
    "pydantic>=2,<3",
    "sentence-transformers>=5,<6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
