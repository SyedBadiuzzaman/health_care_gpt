[project]
name = "doc-agent-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "doc-agent-common",
    "doc-agent-core",
    "doc-agent-db",
    "fastapi>=0.119,<1",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
doc-agent-api = "doc_agent_api.run:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
